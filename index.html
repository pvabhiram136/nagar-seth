<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101f">
<title>RupeeRush — board games with friends</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home">
  <div class="homeCard">
    <div class="logo"><span class="word">Rupee<b>Rush</b></span><span class="eng">BOARD GAMES WITH FRIENDS</span></div>
    <p class="tag"></p>
    <label class="field">Your name
      <input id="nameInput" maxlength="16" placeholder="e.g. Asha" autocomplete="off">
    </label>
    <div id="homeInvite" hidden>
      <button class="btn primary big" id="joinInviteBtn">Join room <b id="inviteCode"></b></button>
      <button class="btn ghost" id="homeOther">Create my own room instead</button>
    </div>
    <div id="homeMain">
      <div class="picker">
        <button type="button" class="gcard" data-game="rupeerush"><span class="gi">🏙️</span><b>RupeeRush</b><small>City business game</small></button>
        <button type="button" class="gcard" data-game="snakes"><span class="gi">🐍</span><b>Snakes &amp; Ladders</b><small>Race to 100</small></button>
        <button type="button" class="gcard" data-game="ludo"><span class="gi">🎯</span><b>Ludo</b><small>Race your tokens home</small></button>
        <button type="button" class="gcard" data-game="teenpatti"><span class="gi">🃏</span><b>Teen Patti</b><small>3 cards, play chips</small></button>
        <button type="button" class="gcard" data-game="rummy"><span class="gi">🂡</span><b>Rummy</b><small>13-card Indian rummy</small></button>
      </div>
      <button class="btn primary big" id="createBtn">Create a private room</button>
      <div class="or"><span>or join a friend</span></div>
      <form id="joinForm" class="joinRow">
        <input id="codeInput" maxlength="5" placeholder="ROOM CODE" autocomplete="off">
        <button class="btn">Join</button>
      </form>
    </div>
    <ul class="feats"></ul>
  </div>
</section>

<section id="room" hidden>
  <aside id="left">
    <div class="panel" id="roomBox"></div>
    <div class="panel" id="playersBox"></div>
    <div class="panel" id="chatBox">
      <h3>Chat</h3>
      <div id="chatLog"></div>
      <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something…" autocomplete="off"><button class="btn small">Send</button></form>
    </div>
  </aside>

  <main id="mid">
    <div id="board">
      <div id="center">
        <div class="brand"><span class="word">Rupee<b>Rush</b></span><span class="eng">INDIA CITIES · BUSINESS GAME</span></div>
        <div id="diceRow"><div class="die" id="d1"></div><div class="die" id="d2"></div><div id="diceSum"></div></div>
        <div id="status"></div>
        <div id="actions"></div>
        <div id="auctionBox" hidden></div>
        <div id="feed"></div>
        <div id="cardView" hidden></div>
      </div>
      <div id="tokens"></div>
    </div>
    <div id="gwrap" hidden>
      <div id="gboard"></div>
      <div id="hud">
        <div class="hudDie"><div class="die" id="gd"></div></div>
        <div id="hudText"></div>
        <div id="hudAct"></div>
      </div>
    </div>
  </main>

  <aside id="right"></aside>
</section>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="conn" hidden>Reconnecting…</div>
<div id="toasts"></div>

<script src="app.js"></script>
<script src="race.js"></script>
<script src="snakes.js"></script>
<script src="ludo.js"></script>
<script src="cards.js"></script>
<script src="teenpatti.js"></script>
<script src="rummy.js"></script>
</body>
</html>
