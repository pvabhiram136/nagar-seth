<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15101f">
<title>Nagar Seth — the Indian cities business game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home">
  <div class="homeCard">
    <div class="logo"><span class="hin">नगर सेठ</span><span class="eng">NAGAR SETH</span></div>
    <p class="tag">Buy cities from Patna to Mumbai, collect rent in rupees, and bankrupt your friends — live, on any device.</p>
    <label class="field">Your name
      <input id="nameInput" maxlength="16" placeholder="e.g. Asha" autocomplete="off">
    </label>
    <div id="homeInvite" hidden>
      <button class="btn primary big" id="joinInviteBtn">Join room <b id="inviteCode"></b></button>
      <button class="btn ghost" id="homeOther">Create my own room instead</button>
    </div>
    <div id="homeMain">
      <button class="btn primary big" id="createBtn">Create a private room</button>
      <div class="or"><span>or join a friend</span></div>
      <form id="joinForm" class="joinRow">
        <input id="codeInput" maxlength="5" placeholder="ROOM CODE" autocomplete="off">
        <button class="btn">Join</button>
      </form>
    </div>
    <ul class="feats">
      <li>🎲 2–8 players, bots included</li>
      <li>🏠 Houses, hotels &amp; mortgages</li>
      <li>🔨 Live auctions</li>
      <li>🤝 Player-to-player trades</li>
    </ul>
  </div>
</section>

<section id="room" hidden>
  <aside id="left">
    <div class="panel" id="roomBox"></div>
    <div class="panel" id="playersBox"></div>
    <div class="panel" id="chatBox">
      <h3>Chat</h3>
      <div id="chatLog"></div>
      <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Say something…" autocomplete="off"><button class="btn small">Send</button></form>
    </div>
  </aside>

  <main id="mid">
    <div id="board">
      <div id="center">
        <div class="brand"><span class="hin">नगर सेठ</span><span class="eng">NAGAR SETH</span></div>
        <div id="diceRow"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
        <div id="status"></div>
        <div id="actions"></div>
        <div id="auctionBox" hidden></div>
        <div id="feed"></div>
        <div id="cardView" hidden></div>
      </div>
      <div id="tokens"></div>
    </div>
  </main>

  <aside id="right"></aside>
</section>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="conn" hidden>Reconnecting…</div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
